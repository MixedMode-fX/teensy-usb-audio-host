; PlatformIO Project Configuration File
;
; This repository is a library. The environments here build its examples as
; firmware for the boards it supports and run its framework-free parts as
; native unit tests, which is what CI does on every push. A project that uses
; the library does not need any of this: it lists the repository in lib_deps.
;
; Every dependency is pinned so a cold cache resolves the same packages as any
; other machine. The Teensy platform version is what pins USBHost_t36 and the
; Audio library, which ship inside the core.

[platformio]
default_envs = passthrough_teensy41, record_teensy41
src_dir = .

[env]
; The library's own sources and the example compile as project sources, so
; they are held to the strict flags (scripts/example_ino.py turns the sketch
; into a .cpp under .pio/examples/ for that); the core and its libraries are passed as
; -isystem by scripts/project_warnings.py and judged by their own.
; -Weffc++ (C++ only) is added by the same script, minus its complaint about
; the base classes USBDriver and AudioStream having no virtual destructor:
; nothing here is ever deleted through them.
extra_scripts =
  pre:scripts/example_ino.py
  post:scripts/project_warnings.py
build_src_flags =
  -Wall
  -Wextra
  -Wshadow
  -Werror
build_flags =
  -I src

[teensy]
platform = teensy@6.0.0
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
build_flags =
  ${env.build_flags}
  -D USB_SERIAL

[env:passthrough_teensy41]
extends = teensy
board = teensy41
custom_example = examples/Passthrough
build_src_filter = +<src/> +<.pio/examples/Passthrough/>

[env:record_teensy41]
extends = teensy
board = teensy41
custom_example = examples/RecordToSD
build_src_filter = +<src/> +<.pio/examples/RecordToSD/>

[env:passthrough_teensy36]
extends = teensy
board = teensy36
custom_example = examples/Passthrough
build_src_filter = +<src/> +<.pio/examples/Passthrough/>

[env:record_teensy36]
extends = teensy
board = teensy36
custom_example = examples/RecordToSD
build_src_filter = +<src/> +<.pio/examples/RecordToSD/>

[env:reverb_teensy41]
extends = teensy
board = teensy41
custom_example = examples/Reverb
build_src_filter = +<src/> +<.pio/examples/Reverb/>

[env:reverb_teensy36]
extends = teensy
board = teensy36
custom_example = examples/Reverb
build_src_filter = +<src/> +<.pio/examples/Reverb/>

[env:delay_teensy41]
extends = teensy
board = teensy41
custom_example = examples/StereoDelay
build_src_filter = +<src/> +<.pio/examples/StereoDelay/>

[env:delay_teensy36]
extends = teensy
board = teensy36
custom_example = examples/StereoDelay
build_src_filter = +<src/> +<.pio/examples/StereoDelay/>

[env:overdrive_teensy41]
extends = teensy
board = teensy41
custom_example = examples/Overdrive
build_src_filter = +<src/> +<.pio/examples/Overdrive/>

[env:overdrive_teensy36]
extends = teensy
board = teensy36
custom_example = examples/Overdrive
build_src_filter = +<src/> +<.pio/examples/Overdrive/>

[env:modulation_teensy41]
extends = teensy
board = teensy41
custom_example = examples/Modulation
build_src_filter = +<src/> +<.pio/examples/Modulation/>

[env:modulation_teensy36]
extends = teensy
board = teensy36
custom_example = examples/Modulation
build_src_filter = +<src/> +<.pio/examples/Modulation/>

; The VST host example carries its plug-in sources next to the sketch, in
; plugins.cpp, which compiles here as a project source as well.
[env:vsthost_teensy41]
extends = teensy
board = teensy41
custom_example = examples/VSTHost
build_src_filter = +<src/> +<.pio/examples/VSTHost/> +<examples/VSTHost/plugins.cpp>

[env:vsthost_teensy36]
extends = teensy
board = teensy36
custom_example = examples/VSTHost
build_src_filter = +<src/> +<.pio/examples/VSTHost/> +<examples/VSTHost/plugins.cpp>

; The MIDI-controlled VST host plays the VSTHost example's plug-ins: that
; example's directory goes on the include path for plugins.h, and its
; plugins.cpp compiles here too.
[env:vstmidi_teensy41]
extends = teensy
board = teensy41
custom_example = examples/VSTHostMIDI
build_flags = ${teensy.build_flags} -I examples/VSTHost
build_src_filter = +<src/> +<.pio/examples/VSTHostMIDI/> +<examples/VSTHost/plugins.cpp>

[env:vstmidi_teensy36]
extends = teensy
board = teensy36
custom_example = examples/VSTHostMIDI
build_flags = ${teensy.build_flags} -I examples/VSTHost
build_src_filter = +<src/> +<.pio/examples/VSTHostMIDI/> +<examples/VSTHost/plugins.cpp>

; Clouds' reverb as a plug-in, played from a USB MIDI controller. The
; plug-in and the Mutable Instruments sources it compiles sit next to the
; sketch, whose directory is on the include path (scripts/example_ino.py)
; for their root-relative includes.
[env:cumulus_teensy41]
extends = teensy
board = teensy41
custom_example = examples/CumulusReverb
build_src_filter = +<src/> +<.pio/examples/CumulusReverb/> +<examples/CumulusReverb/cumulus_reverb.cpp>

[env:cumulus_teensy36]
extends = teensy
board = teensy36
custom_example = examples/CumulusReverb
build_src_filter = +<src/> +<.pio/examples/CumulusReverb/> +<examples/CumulusReverb/cumulus_reverb.cpp>

; Host build of the framework-free parts: the descriptor parser, the pacer,
; the sample ring and the VST host's plug-in interface, driven by the suites
; under test/. Runs anywhere. The VSTHost example's plug-in sources are built
; in so that the suite runs the real Airwindows code against audioeffectx.h,
; and the CumulusReverb example's so that its suite runs Clouds' reverb.
[env:native]
platform = native@1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity@2.6.1
test_build_src = yes
build_src_filter =
  +<src/usb_audio_host/audio_function.cpp>
  +<src/usb_audio_host/pacer.cpp>
  +<examples/VSTHost/plugins.cpp>
  +<examples/CumulusReverb/cumulus_reverb.cpp>
build_flags =
  ${env.build_flags}
  -I examples/CumulusReverb
  -std=gnu++17
